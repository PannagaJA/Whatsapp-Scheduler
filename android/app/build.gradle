plugins {
    id "com.android.application"
}

android {
    namespace "com.whatsapp.scheduler"
    compileSdk 34

    defaultConfig {
        applicationId "com.whatsapp.scheduler"
        minSdk 24
        targetSdk 34
        versionCode project.hasProperty("versionCode") ? project.property("versionCode").toInteger() : 1
        versionName project.hasProperty("versionName") ? project.property("versionName").toString() : "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
