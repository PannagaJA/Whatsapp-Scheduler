plugins {
    id "com.android.application"
}

android {
    namespace "com.whatsapp.scheduler"
    compileSdk 34

    defaultConfig {
        applicationId "com.whatsapp.scheduler"
        minSdk 24
        targetSdk 34
        versionCode project.hasProperty("versionCode") ? project.property("versionCode").toInteger() : 1
        versionName project.hasProperty("versionName") ? project.property("versionName").toString() : "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def kAlias = System.getenv("KEY_ALIAS")
            def kPass = System.getenv("KEY_PASSWORD")

            if (ksPath && ksPass && kAlias && kPass && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (System.getenv("KEYSTORE_PATH") && file(System.getenv("KEYSTORE_PATH")).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    gradle.taskGraph.whenReady { taskGraph ->
        if (taskGraph.hasTask(":app:assembleRelease") || taskGraph.hasTask("assembleRelease")) {
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPass = System.getenv("KEYSTORE_PASSWORD")
            def kAlias = System.getenv("KEY_ALIAS")
            def kPass = System.getenv("KEY_PASSWORD")
            if (!ksPath || !file(ksPath).exists() || !ksPass || !kAlias || !kPass) {
                throw new GradleException("ERROR: assembleRelease requires valid signing environment variables (KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Insecure fallbacks are strictly prohibited.")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
