name: Build Android APK (WhatsApp-Scheduler.apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/WhatsApp-Scheduler.apk
          ls -lh build-output/WhatsApp-Scheduler.apk

      - name: Upload WhatsApp-Scheduler.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Scheduler-APK
          path: build-output/WhatsApp-Scheduler.apk
          retention-days: 90
