name: Build Android APK (WhatsApp-Scheduler.apk)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/WhatsApp-Scheduler.apk
          ls -lh build-output/WhatsApp-Scheduler.apk

      - name: Upload WhatsApp-Scheduler.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Scheduler-APK
          path: build-output/WhatsApp-Scheduler.apk
          retention-days: 90

      - name: Publish GitHub Release (with direct APK download)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/WhatsApp-Scheduler.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
