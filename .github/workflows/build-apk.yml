name: Android CI & Controlled Release Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Set to "true" to build and publish an official signed release APK'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_tag:
        description: 'Strict SemVer release tag (e.g. v1.0.1)'
        required: true
        default: ''
        type: string

# Top-level permissions are strictly empty; permissions are scoped at the job level
permissions: {}

jobs:
  # CI Job: Automatically builds and verifies debug APK on push/PR without publishing releases
  ci_validation:
    name: CI Validation (Debug Build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          BUILD_NUM=${{ github.run_number }}
          gradle assembleDebug -PversionCode=$BUILD_NUM -PversionName="1.0.$BUILD_NUM-debug" --no-daemon --stacktrace

      - name: Prepare Debug Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/WhatsApp-Scheduler-DEBUG.apk
          ls -lh build-output/WhatsApp-Scheduler-DEBUG.apk

      - name: Upload Debug APK Artifact (Internal CI)
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Scheduler-DEBUG-APK
          path: build-output/WhatsApp-Scheduler-DEBUG.apk
          retention-days: 14

  # Release Job: Only runs on deliberate manual workflow_dispatch with publish_release == 'true' on main/master
  publish_signed_release:
    name: Build & Publish Signed Release APK
    needs: ci_validation
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_release == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      github.event.repository.fork == false
    environment: production-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Validate Release Tag SemVer & Uniqueness
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          echo "Validating requested release tag: '$INPUT_TAG'..."
          if [[ -z "$INPUT_TAG" ]]; then
            echo "::error::release_tag parameter is required for release publishing."
            exit 1
          fi
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$INPUT_TAG'. Must follow strict SemVer format (e.g. v1.0.0, v2.1.3)."
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$INPUT_TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$INPUT_TAG' already exists locally. Duplicate release prevented."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$INPUT_TAG" | grep -q "$INPUT_TAG"; then
            echo "::error::Tag '$INPUT_TAG' already exists on remote origin. Duplicate release prevented."
            exit 1
          fi
          echo "Tag validation succeeded: '$INPUT_TAG' is unique and valid SemVer."

      - name: Verify Release Signing Secrets (Fail-Closed)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Verifying presence of required GitHub Secrets for release signing..."
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings."
            exit 1
          fi
          if [ -z "$KS_PASS" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is missing in GitHub repository settings."
            exit 1
          fi
          if [ -z "$K_ALIAS" ]; then
            echo "::error::KEY_ALIAS secret is missing in GitHub repository settings."
            exit 1
          fi
          if [ -z "$K_PASS" ]; then
            echo "::error::KEY_PASSWORD secret is missing in GitHub repository settings."
            exit 1
          fi
          echo "All release signing secrets are present."

      - name: Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="$(mktemp -d /tmp/signing_keystore_XXXXXX)"
          KEYSTORE_FILE="$KEYSTORE_DIR/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "keystore_path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"
          echo "keystore_dir=$KEYSTORE_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate Keystore Integrity & Alias
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Validating keystore integrity and alias existence..."
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$K_ALIAS" -storepass "$KS_PASS" >/dev/null
          if [ $? -ne 0 ]; then
            echo "::error::Keystore validation failed: Alias '$K_ALIAS' does not exist or password invalid."
            exit 1
          fi
          echo "Keystore alias '$K_ALIAS' verified successfully."

      - name: Build Official Signed Release APK
        working-directory: ./android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="${RELEASE_TAG#v}"
          echo "Building signed release APK version: $VERSION_NAME ($BUILD_NUM)..."
          gradle assembleRelease -PversionCode=$BUILD_NUM -PversionName="$VERSION_NAME" --no-daemon --stacktrace

      - name: Verify Signed APK Certificate
        run: |
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated at expected path."
            exit 1
          fi
          echo "Verifying APK signing status..."
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$RELEASE_APK"
          else
            keytool -printcert -jarfile "$RELEASE_APK"
          fi
          echo "Release APK signature check complete."

      - name: Prepare Signed Release APK Artifact
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk "build-output/WhatsApp-Scheduler-${RELEASE_TAG}.apk"
          ls -lh "build-output/WhatsApp-Scheduler-${RELEASE_TAG}.apk"

      - name: Upload Release APK Artifact
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Scheduler-Release-APK
          path: build-output/WhatsApp-Scheduler-${{ env.RELEASE_TAG }}.apk
          retention-days: 90

      - name: Publish Draft GitHub Release (Awaiting Human Approval)
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WhatsApp Scheduler ${{ env.RELEASE_TAG }} (Draft)
          files: build-output/WhatsApp-Scheduler-${{ env.RELEASE_TAG }}.apk
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Secure Keystore Cleanup
        if: always()
        run: |
          if [ -n "${{ steps.keystore.outputs.keystore_dir }}" ] && [ -d "${{ steps.keystore.outputs.keystore_dir }}" ]; then
            echo "Securely wiping decoded release keystore..."
            rm -rf "${{ steps.keystore.outputs.keystore_dir }}"
          fi
