<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Scheduler Diagnostics</title>
  <style>
    :root {
      --bg: #0b141a;
      --card-bg: #111b21;
      --border: #222d34;
      --text: #e9edef;
      --text-muted: #8696a0;
      --primary: #00a884;
      --primary-hover: #06cf9c;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --code-bg: #0c1317;
      --good: #25d366;
      --bad: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    .container { max-width: 1050px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 22px; font-weight: 600; }
    .actions { display: flex; gap: 10px; }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.15s ease;
    }
    button.primary { background: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    button.danger { background: #2a1b1b; color: var(--bad); border: 1px solid #452121; }
    button.danger:hover { background: var(--danger); color: #fff; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.good { background: var(--good); }
    .status-dot.bad { background: var(--bad); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1a252c; font-size: 13px; }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--text-muted); }
    .stat-value { font-weight: 500; }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      color: #aebac1;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 550px;
      overflow-y: auto;
    }
    .log-entry { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #182229; }
    .log-time { color: var(--primary); font-weight: 600; margin-right: 8px; }
    .log-type { color: #53bdeb; font-weight: 600; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>WhatsApp Scheduler Diagnostics</h1>
        <div id="connectionStatus" class="status-badge" style="margin-top: 6px;">
          <span class="status-dot bad" id="statusDot"></span>
          <span id="statusText">Checking status…</span>
        </div>
      </div>
      <div class="actions">
        <button id="refresh" class="primary">Refresh</button>
        <button id="clear" class="danger">Clear Logs</button>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-title">WhatsApp Web Session</div>
        <div class="stat-row"><span class="stat-label">Tab Detected:</span><span class="stat-value" id="tabStatus">-</span></div>
        <div class="stat-row"><span class="stat-label">Active Chat:</span><span class="stat-value" id="currentChat">-</span></div>
        <div class="stat-row"><span class="stat-label">Main Pane Loaded:</span><span class="stat-value" id="mainStatus">-</span></div>
        <div class="stat-row"><span class="stat-label">Chat Composer Available:</span><span class="stat-value" id="composerStatus">-</span></div>
      </div>
      <div class="card">
        <div class="card-title">Scheduler & Queue</div>
        <div class="stat-row"><span class="stat-label">Total Scheduled Jobs:</span><span class="stat-value" id="jobCount">0</span></div>
        <div class="stat-row"><span class="stat-label">Pending / Retrying:</span><span class="stat-value" id="pendingCount">0</span></div>
        <div class="stat-row"><span class="stat-label">Total Log Events:</span><span class="stat-value" id="logCount">0</span></div>
        <div class="stat-row"><span class="stat-label">Last Updated:</span><span class="stat-value" id="lastUpdated">-</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Diagnostic & Execution Traces</div>
      <pre id="out">Loading diagnostic data…</pre>
    </div>
  </div>
  <script src="debug.js"></script>
</body>
</html>
