<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WhatsApp Scheduler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="brand"><img src="../assets/logo.svg" alt="WhatsApp Scheduler logo"><div><h1>WhatsApp Scheduler</h1><p class="brand-sub">Schedule messages & attachments</p></div></div>
        <p id="waStatus">Checking WhatsApp Web…</p>
      </div>
      <button id="refresh" class="icon" title="Refresh">↻</button>
    </header>

    <section class="card">
      <div class="section-head">
        <div>
          <span class="label">Current WhatsApp chat</span>
          <strong id="currentChat">Not detected</strong>
        </div>
        <button id="useCurrent" class="secondary">Use current</button>
      </div>

      <label for="contactSelect">Recipient</label>
      <div class="recipient-row">
        <select id="contactSelect">
          <option value="">Choose a WhatsApp contact…</option>
        </select>
        <button id="openSelected" class="secondary" title="Open selected chat">Open</button>
      </div>
      <input id="contactSearch" class="search" placeholder="Filter contacts…" autocomplete="off">
      <p class="hint">The list comes from your WhatsApp chat list. You can also type any contact/group name below and click Open; the extension will use WhatsApp Web search.</p>

      <label for="contact">Recipient name</label>
      <input id="contact" placeholder="Type a contact/group name or choose above" autocomplete="off">

      <label for="text">Message</label>
      <textarea id="text" placeholder="Type your message…"></textarea>

      <label for="files">Attachments</label>
      <input id="files" type="file" multiple>
      <div id="fileList" class="files"></div>

      <div class="grid">
        <div><label for="date">Date</label><input id="date" type="date"></div>
        <div><label for="time">Time</label><input id="time" type="time"></div>
      </div>

      <button id="schedule" class="primary">Schedule message</button>
      <div id="notice"></div>
    </section>

    <section>
      <div class="section-title">
        <h2>Scheduled messages</h2>
        <div><button id="openDebug" class="link">Diagnostics</button> <button id="openOptions" class="link">Settings</button></div>
      </div>
      <div id="messages"></div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
